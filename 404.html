<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page introuvable — Entre deux rives</title>
  <link rel="icon" href="/entre-deux-rives/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#8F3D22;color:#F6ECDA;font-family:"Source Sans 3",system-ui,sans-serif;text-align:center;padding:1.5rem}
    h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(2.5rem,9vw,4rem);margin:0 0 .5rem}
    p{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.5rem;margin:0 0 2rem}
    a{display:inline-block;background:#F6ECDA;color:#6F2D17;padding:.9rem 1.5rem;font-weight:600;text-decoration:none;border-radius:2px}
    a:focus-visible{outline:3px solid #E8A33D;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>Cette rive n'existe pas</h1>
    <p>La page que vous cherchez est introuvable.</p>
    <!-- Lien absolu avec le sous-dossier : le 404 peut être servi depuis n'importe quelle profondeur d'URL -->
    <a href="/entre-deux-rives/">Retour à l'accueil</a>
  </main>
</body>
</html>
